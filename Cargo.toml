[workspace]
resolver = "2"
members = [
    "crates/refract-core",
    "crates/refract-engine",
    "apps/desktop",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
authors = ["Advaita Chandra"]
repository = "https://github.com/w1tneess/refract"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

