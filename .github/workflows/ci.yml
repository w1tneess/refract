name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0 (version from packageManager)
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm manifest:check
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @refract/web exec playwright install --with-deps chromium firefox
      - run: pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: apps/web/test-results

  rust-desktop:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@stable
      - if: matrix.os == 'ubuntu-24.04'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev ffmpeg
      - run: cargo check --workspace
      - run: cargo test --workspace

      - if: matrix.os == 'ubuntu-24.04'
        run: cargo test -p refract-engine --test audio_ffmpeg_integration -- --ignored
      - if: matrix.os == 'ubuntu-24.04'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - if: matrix.os == 'ubuntu-24.04'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.0
      - if: matrix.os == 'ubuntu-24.04'
        run: |
          pnpm install --frozen-lockfile
          node --test scripts/generate-manifest.test.mjs
