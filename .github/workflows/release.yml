name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.1.0)'
        required: true
        default: 'v1.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: refract-windows-x86_64.zip
            binary_src: target/release/refract-desktop.exe
            binary_name: refract.exe
          - os: macos-latest
            artifact_name: refract-macos-arm64.tar.gz
            binary_src: target/release/refract-desktop
            binary_name: refract
          - os: ubuntu-24.04
            artifact_name: refract-linux-x86_64.tar.gz
            binary_src: target/release/refract-desktop
            binary_name: refract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Build Desktop Binary
        run: cargo build --release -p refract-desktop

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/release/refract-desktop.exe dist/refract.exe
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/release/refract-desktop dist/refract
          cp README.md dist/
          cp LICENSE dist/
          tar -czvf ${{ matrix.artifact_name }} -C dist .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec87453c663f532452554ff # v2.2.1
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Refract ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: release-artifacts/*
          body: |
            ## Refract ${{ github.event.inputs.tag_name || github.ref_name }}

            Local-first file converter — **pure native Rust + Slint desktop app** and **100% client-side WebAssembly web app**. All conversions run strictly on your own machine with no uploads, no accounts, no ads, and no telemetry.

            ### Included Desktop Packages
            - **Windows (x86_64)**: `refract-windows-x86_64.zip`
            - **macOS (Apple Silicon / ARM64)**: `refract-macos-arm64.tar.gz`
            - **Linux (x86_64)**: `refract-linux-x86_64.tar.gz`
            - **Verification**: `SHA256SUMS.txt`

            ### Highlights
            - **All 11 Tools on Desktop & Web**:
              - **Images**: Convert (EXIF orientation baking, RGBA-to-white flattening, metadata removal), Compress (target KB with automatic scale-down fallback), Resize (Lanczos-3 by pixels or cm + DPI) across JPEG, PNG, and WebP (plus HEIC input on Web).
              - **PDF**: Merge, Split by page ranges (with object pruning), Reorder pages, Images to PDF, PDF to images, and Lossless `lopdf` / QPDF compression — with password-protected PDF unlocking.
              - **Audio**: Convert between MP3, WAV, M4A, and OGG (128–320 kbps) and exact timestamp trimming (`mm:ss` / `hh:mm:ss` / seconds).
            - **Native Desktop UX**: Standalone single executable with no webview, Light/Dark theme persistence, custom output folder selection, batch queue management, and "Show in Folder" reveal.
            - **Web App**: Apple-inspired UI with Command Palette, Optical Loupe comparison modal, PWA manifest, and gzip-compressed FFmpeg WASM bundle for faster loads.

            ### Desktop Optional External Dependencies
            - **Audio convert/trim**: `ffmpeg` and `ffprobe` in `PATH`.
            - **PDF to images (rasterization)**: `mutool`, `pdftoppm`, `pdftocairo`, or `ghostscript` in `PATH` (automatically falls back to embedded image extraction if none are installed).
