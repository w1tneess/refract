name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v0.1.0)'
        required: true
        default: 'v0.1.0'

permissions:
  contents: write

jobs:
  build-release:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact_name: refract-windows-x86_64.zip
            binary_src: target/release/refract-desktop.exe
            binary_name: refract.exe
          - os: macos-latest
            artifact_name: refract-macos-arm64.tar.gz
            binary_src: target/release/refract-desktop
            binary_name: refract
          - os: ubuntu-24.04
            artifact_name: refract-linux-x86_64.tar.gz
            binary_src: target/release/refract-desktop
            binary_name: refract
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: dtolnay/rust-toolchain@stable

      - if: matrix.os == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxcb1-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Build Desktop Binary
        run: cargo build --release -p refract-desktop

      - name: Package Artifact (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path dist -Force
          Copy-Item target/release/refract-desktop.exe dist/refract.exe
          Copy-Item README.md dist/
          Copy-Item LICENSE dist/
          Compress-Archive -Path dist/* -DestinationPath ${{ matrix.artifact_name }}

      - name: Package Artifact (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          mkdir dist
          cp target/release/refract-desktop dist/refract
          cp README.md dist/
          cp LICENSE dist/
          tar -czvf ${{ matrix.artifact_name }} -C dist .

      - name: Upload Build Artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_name }}

  publish-release:
    name: Publish Release
    needs: build-release
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download all artifacts
        uses: actions/download-artifact@fa0a91b85d4f404e444e00e005971372dc801d16 # v8.0.0
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Generate Checksums
        working-directory: release-artifacts
        run: |
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c95fe1489396fe8a9ec87453c663f532452554ff # v2.2.1
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: Refract ${{ github.event.inputs.tag_name || github.ref_name }}
          draft: false
          prerelease: false
          files: release-artifacts/*
          body: |
            ## Refract Desktop v1 Release

            High-performance, pure native file converter built with Rust and Slint UI. All conversions happen 100% locally on your machine.

            ### Included Packages
            - **Windows (x86_64)**: `refract-windows-x86_64.zip`
            - **macOS (Apple Silicon / ARM64)**: `refract-macos-arm64.tar.gz`
            - **Linux (x86_64)**: `refract-linux-x86_64.tar.gz`
            - **Verification**: `SHA256SUMS.txt`

            ### Supported Operations
            - **Images**: Convert (with EXIF orientation baking and alpha flattening), Compress (target KB), Resize (Lanczos-3) across JPEG, PNG, WebP.
            - **PDF**: Merge multiple PDFs, Split by page ranges (with object pruning), Reorder pages, Lossless `lopdf` compression.
            - **Audio**: Transcode between MP3, WAV, M4A, OGG with configurable bitrates and exact timestamp trimming (via system FFmpeg).
