<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f5f5f7" />
    <meta name="description" content="Local-first image, PDF, and audio converter running 100% in your browser via WebAssembly. No uploads, no accounts, no telemetry." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Refract — Local-First File Converter" />
    <meta property="og:description" content="Convert images, PDFs, and audio locally in your browser via WebAssembly. Nothing is uploaded." />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Refract — Local-First File Converter" />
    <meta name="twitter:description" content="Convert images, PDFs, and audio locally in your browser via WebAssembly. Nothing is uploaded." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Refract — Local-First File Converter</title>
    <script>
      (function() {
        try {
          var t = localStorage.getItem('refract.theme');
          var isDark = t === 'dark' || ((!t || t === 'system') && window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            document.documentElement.classList.add('dark');
            if (meta) meta.setAttribute('content', '#000000');
          } else {
            document.documentElement.setAttribute('data-theme', 'light');
            document.documentElement.classList.remove('dark');
            if (meta) meta.setAttribute('content', '#f5f5f7');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
