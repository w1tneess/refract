[package]
name = "refract-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
refract-core = { path = "../../crates/refract-core" }
refract-engine = { path = "../../crates/refract-engine" }
slint = { version = "1.9", features = ["std"] }
rfd = "0.15"
open = "5.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
which = "7.0"
dirs = "5.0"

[build-dependencies]
slint-build = "1.9"

[dev-dependencies]
tempfile = "3.27"
# Test-only: encrypt marker PDFs with distinct passwords (same version refract-engine already uses).
lopdf = "0.40"
